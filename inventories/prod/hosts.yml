---
# prod inventory — the real Raspberry Pi.
# Replace every <INSERT ...> value below, OR (recommended) put your real values in
# host_vars/prod-pi.yml, which is git-ignored and overrides these placeholders.
pi:
  hosts:
    prod-pi:
      ansible_host: "<INSERT YOUR PI's IP HERE>"
      ansible_user: "<INSERT YOUR PI LOGIN USER HERE>"               # the user created in Raspberry Pi Imager
      ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
      admin_user_name: "<INSERT YOUR PI ADMIN USER HERE>"            # usually the same as ansible_user
      admin_user_ssh_key: "<INSERT YOUR SSH PUBLIC KEY HERE>"        # contents of ~/.ssh/<key>.pub
      firewall_ssh_iface: wlan0                                      # wlan0 for Wi-Fi, eth0 for cable
      firewall_ssh_allowed_ipv4: "<INSERT THE IP YOU SSH FROM HERE>" # your laptop's IP on the LAN
