---
# dev inventory — a disposable Vagrant VM standing in for the Pi.
# Replace every <INSERT ...> value below, OR (recommended) put your real values in
# host_vars/dev-pi.yml, which is git-ignored and overrides these placeholders.
pi:
  hosts:
    dev-pi:
      ansible_host: "<INSERT YOUR VAGRANT VM's IP HERE>"            # e.g. from: vagrant ssh-config
      ansible_port: 22
      ansible_user: vagrant
      ansible_ssh_private_key_file: .vagrant/machines/default/libvirt/private_key
      ansible_ssh_common_args: "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
      admin_user_ssh_key: "<INSERT YOUR SSH PUBLIC KEY HERE>"        # contents of ~/.ssh/id_ed25519.pub
      firewall_ssh_iface: eth0
      firewall_ssh_allowed_ipv4: "<INSERT THE IP YOU SSH FROM HERE>" # your host's IP on the VM network
