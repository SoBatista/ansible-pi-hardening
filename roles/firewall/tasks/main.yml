---
# Host firewall with nftables: default-deny inbound, SSH only from the admin host.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Deploy the nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Enable nftables now and at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
