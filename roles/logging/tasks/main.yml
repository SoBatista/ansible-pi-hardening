---
# Persistent journald logs that survive a reboot.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent journald storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-persistent.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=256M
      SystemKeepFree=1G
  notify: Restart journald
